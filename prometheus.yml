global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'semantic-cache-proxy'
    static_configs:
      - targets: ['semantic-proxy:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-stack:6379']
    scrape_interval: 30s